<div class="ra-sidebar-backdrop d-lg-none"></div>
<aside class="ra-sidebar">
  <div class="ra-sidebar__brand">
    <div>
      <div class="ra-sidebar__brand-name">RecruitAI Pro</div>
      <div class="ra-sidebar__brand-sub">Applicant Workspace</div>
    </div>
  </div>

  <nav class="ra-sidebar__nav">
    <a class="ra-nav-link{% if active_nav == 'dashboard' %} active{% endif %}" href="{% url 'applicant_dashboard' %}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="ra-nav-link{% if active_nav == 'jobs' %} active{% endif %}" href="{% url 'applicant_browse_jobs' %}"><i class="bi bi-briefcase"></i> Browse Jobs</a>
    <a class="ra-nav-link{% if active_nav == 'applications' %} active{% endif %}" href="{% url 'applicant_applications' %}"><i class="bi bi-people"></i> My Applications</a>
    <a class="ra-nav-link{% if active_nav == 'interviews' %} active{% endif %}" href="{% url 'applicant_interviews' %}"><i class="bi bi-calendar-event"></i> Interviews</a>
    <a class="ra-nav-link{% if active_nav == 'skills' %} active{% endif %}" href="{% url 'applicant_skill_insights' %}"><i class="bi bi-bar-chart"></i> Skill Insights</a>
    <a class="ra-nav-link{% if active_nav == 'notifications' %} active{% endif %}" href="{% url 'applicant_notifications' %}"><i class="bi bi-bell"></i> Notifications{% if unread_notifications_count %}<span class="ra-badge ra-badge--danger ms-auto">{{ unread_notifications_count }}</span>{% endif %}</a>
  </nav>

  <div class="ra-sidebar__foot">
    <a class="ra-nav-link{% if active_nav == 'settings' %} active{% endif %}" href="{% url 'applicant_settings' %}"><i class="bi bi-gear"></i> Settings</a>
    <form method="post" action="{% url 'logout' %}" class="m-0 p-0">{% csrf_token %}<button type="submit" class="ra-nav-link ra-nav-link--danger w-100 text-start border-0 bg-transparent"><i class="bi bi-box-arrow-right"></i> Logout</button></form>
  </div>
</aside>
