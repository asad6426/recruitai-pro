{% extends "base.html" %}
{% load static %}
{% block body %}
<div class="ra-auth">

  <aside class="ra-auth__brand">
    <a href="{% url 'index' %}" class="d-flex align-items-center gap-2 text-white text-decoration-none">
      <img src="{% static 'assets/img/logo.svg' %}" alt="" width="44" height="44" class="bg-white rounded-3 p-1">
      <span class="fs-4 fw-bold">RecruitAI</span>
    </a>

    <div class="my-auto py-5">
      {% block brand_panel %}{% endblock %}
    </div>

    <div class="d-flex flex-wrap justify-content-between gap-3 pt-4 text-sm"
         style="border-top:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7);">
      <span>&copy; 2024 RecruitAI ATS. All rights reserved.</span>
      <span class="d-flex gap-4">
        <a href="#" class="text-decoration-none" style="color:rgba(255,255,255,.7);">Privacy</a>
        <a href="#" class="text-decoration-none" style="color:rgba(255,255,255,.7);">Terms</a>
      </span>
    </div>
  </aside>

  <main class="ra-auth__form">
    <div class="ra-auth__form-inner">
      <div class="d-flex justify-content-end mb-3">
        <button class="ra-icon-btn" data-ra-theme-toggle type="button" aria-label="Toggle dark mode">
          <i class="bi bi-moon-stars" data-ra-theme-icon></i>
        </button>
      </div>
      {% block auth_form %}{% endblock %}
    </div>
  </main>
</div>
{% endblock %}
