{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RecruitAI Pro{% endblock %}</title>
{% block meta_description %}{% endblock %}
<link rel="icon" href="{% static 'assets/img/logo.svg' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'assets/css/theme.css' %}" rel="stylesheet">
<link href="{% static 'assets/css/layout.css' %}" rel="stylesheet">
<link href="{% static 'assets/css/components.css' %}" rel="stylesheet">
{% block extra_head %}{% endblock %}
</head>
<body>

{% block body %}{% endblock %}

<div class="ra-toast-stack"></div>
{% include "partials/_toast_bridge.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'assets/js/app.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
