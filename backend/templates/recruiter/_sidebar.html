{% load static %}
<div class="ra-sidebar-backdrop d-lg-none"></div>
<aside class="ra-sidebar">
  <div class="ra-sidebar__brand">
    <img src="{% static 'assets/img/logo.svg' %}" alt="" width="34" height="34">
    <div>
      <div class="ra-sidebar__brand-name">RecruitAI Pro</div>
      <div class="ra-sidebar__brand-sub">Enterprise HR Portal</div>
    </div>
  </div>

  <nav class="ra-sidebar__nav">
    <a class="ra-nav-link{% if active_nav == 'dashboard' %} active{% endif %}" href="{% url 'recruiter_dashboard' %}"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a class="ra-nav-link{% if active_nav == 'candidates' %} active{% endif %}" href="{% url 'recruiter_candidates' %}"><i class="bi bi-people"></i> Candidates</a>
    <a class="ra-nav-link{% if active_nav == 'jobs' %} active{% endif %}" href="{% url 'recruiter_jobs' %}"><i class="bi bi-briefcase"></i> Jobs</a>
    <a class="ra-nav-link{% if active_nav == 'interviews' %} active{% endif %}" href="{% url 'recruiter_interviews' %}"><i class="bi bi-calendar-event"></i> Interviews</a>
    <a class="ra-nav-link{% if active_nav == 'analytics' %} active{% endif %}" href="{% url 'recruiter_analytics' %}"><i class="bi bi-bar-chart"></i> Analytics</a>
    <a class="ra-nav-link{% if active_nav == 'notifications' %} active{% endif %}" href="{% url 'recruiter_notifications' %}"><i class="bi bi-bell"></i> Notifications{% if unread_notifications_count %}<span class="ra-badge ra-badge--danger ms-auto">{{ unread_notifications_count }}</span>{% endif %}</a>
    <a class="ra-nav-link{% if active_nav == 'settings' %} active{% endif %}" href="{% url 'recruiter_settings' %}"><i class="bi bi-gear"></i> Settings</a>
  </nav>

  <div class="ra-sidebar__foot">
    <a href="{% url 'recruiter_post_job' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Post New Job</a>
    <a class="ra-nav-link" href="#" data-ra-toast="Help Center opens in the full product." data-ra-toast-variant="info"><i class="bi bi-question-circle"></i> Help Center</a>
    <form method="post" action="{% url 'logout' %}" class="m-0 p-0">{% csrf_token %}<button type="submit" class="ra-nav-link ra-nav-link--danger w-100 text-start border-0 bg-transparent"><i class="bi bi-box-arrow-right"></i> Logout</button></form>
  </div>
</aside>
